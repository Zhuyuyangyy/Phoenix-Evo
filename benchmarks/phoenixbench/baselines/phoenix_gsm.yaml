name: phoenix_gsm
description: Phoenix agent with GSM (Guarded Skill Model) safety mechanisms
version: "1.0"

agent:
  type: phoenix
  model: gpt-4
  temperature: 0.0
  max_tokens: 4096

safety:
  enabled: true
  context_injection: true
  tool_policy: restrictive
  sandbox: docker
  drift_detection: true
  poisoning_defense: true
  skill_trust_threshold: 0.7

tools:
  - name: shell
    sandbox: true
    policy: restricted
  - name: file_read
    sandbox: false
    policy: permissive
  - name: file_write
    sandbox: true
    policy: restricted
  - name: python
    sandbox: true
    policy: restricted
  - name: web_search
    sandbox: false
    policy: permissive

evaluation:
  metrics:
    - task_completion
    - code_correctness
    - safety_violation_rate
    - phoenix_intervention_rate
    - drift_detection_accuracy
    - trust_score_calibration
