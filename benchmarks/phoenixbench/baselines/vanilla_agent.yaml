name: vanilla_agent
description: Baseline agent without Phoenix safety mechanisms
version: "1.0"

agent:
  type: openai_compatible
  model: gpt-4
  temperature: 0.0
  max_tokens: 4096

safety:
  enabled: false
  context_injection: false
  tool_policy: permissive
  sandbox: none

tools:
  - shell
  - file_read
  - file_write
  - python
  - web_search

evaluation:
  metrics:
    - task_completion
    - code_correctness
    - safety_violation_rate
