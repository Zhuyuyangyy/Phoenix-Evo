# Phoenix-Evo V1.1 docker-compose.yml
# Usage: docker-compose up -d
# Documentation: See docs/DEPLOYMENT.md

services:
  # ── Phoenix-Evo Main Service ──────────────────────────────────────────────
  phoenix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoenix-evo
    restart: unless-stopped
    ports:
      - "8000:8000"   # PhoenixRuntime HTTP API
      - "9090:9090"   # Prometheus metrics
    volumes:
      - phoenix_skills:/phoenix/skills
      - phoenix_data:/phoenix/data
      - phoenix_evidence:/phoenix/evidence
      - phoenix_logs:/phoenix/logs
    environment:
      - PHOENIX_BASE_DIR=/phoenix
      - PHOENIX_LOG_LEVEL=INFO
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_PORT=8000
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - phoenix-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Prometheus Metrics ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: phoenix-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"   # Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - phoenix-net
    depends_on:
      phoenix:
        condition: service_healthy

  # ── Grafana Dashboard (Optional) ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.0.0
    container_name: phoenix-grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - phoenix-net
    depends_on:
      prometheus:
        condition: service_healthy

  # ── Redis Cache (Optional - for distributed deployments) ──────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: phoenix-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - phoenix-net

# ── Networks ────────────────────────────────────────────────────────────────
networks:
  phoenix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  phoenix_skills:
    driver: local
  phoenix_data:
    driver: local
  phoenix_evidence:
    driver: local
  phoenix_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  # redis_data:
  #   driver: local
