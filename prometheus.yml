# Prometheus Configuration for Phoenix-Evo
# See https://prometheus.io/docs/prometheus/latest/configuration/

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Phoenix-Evo metrics
  - job_name: 'phoenix-evo'
    static_configs:
      - targets: ['phoenix:9090']
    scrape_interval: 10s
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
