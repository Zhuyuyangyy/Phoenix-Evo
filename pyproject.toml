[project]
name = "phoenix-evo"
version = "1.1.0"
description = "Phoenix-Evo: Self-Evolving Agent Experience Governance System"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Phoenix-Evo Team"},
]
keywords = ["ai", "agent", "self-evolution", "experience-governance", "skill-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/phoenix-evo/phoenix-evo"
Documentation = "https://github.com/phoenix-evo/phoenix-evo/tree/main/docs"
Repository = "https://github.com/phoenix-evo/phoenix-evo"
Issues = "https://github.com/phoenix-evo/phoenix-evo/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = [
    "S101", "S603", "S607", "B008",  # original ignores
    "DTZ005", "DTZ006", "DTZ011",    # datetime timezone (too many, low risk)
    "PTH123", "PTH118", "PTH110", "PTH120", "PTH100", "PTH103", "PTH208", "PTH108", "PTH107",  # pathlib enforcement (too many)
    "S108", "S311", "S324", "S110", "S112", "S107", "S202",  # security false positives in non-production code
    "N806", "N999", "N817", "N814", "N805",  # naming (scientific/ML conventions)
    "ERA001",   # commented code (sometimes intentional)
    "E741",     # ambiguous variable names
    "B007",     # unused loop variable
    "B904",     # raise without from
    "B018",     # useless expression
    "SIM108", "SIM113", "SIM102",  # simplify suggestions (not critical)
    "SLF001",   # private member access (common in framework code)
    "ARG002", "ARG001", "ARG004", "ARG005",  # unused args (interface conformance)
    "E501",     # line too long (handled by formatter)
    "F821",     # undefined name (type: ignore comments)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "SLF001", "S108", "ARG002", "E701", "E702", "E402", "F821", "DTZ005", "PTH123", "PTH118", "PTH110", "E501", "ERA001", "N806", "B007", "B904", "B018", "SIM108", "SIM113", "SIM102", "ARG001", "ARG004", "ARG005"]
"demo*" = ["E501", "E701", "E702", "E402", "F821", "DTZ005", "S108", "PTH123", "PTH118", "ERA001", "N806", "ARG002", "SLF001"]
"docs/**/demo_*" = ["E501", "E701", "E702", "E402", "F821", "DTZ005", "S108", "PTH123", "PTH118", "ERA001", "N806", "ARG002", "SLF001"]
"experiments/*" = ["E501", "E701", "E702", "E402", "F821", "DTZ005", "S108", "PTH123", "PTH118", "ERA001", "N806", "ARG002", "SLF001", "S311"]
"benchmarks/**" = ["E501", "E701", "E702", "E402", "F821", "DTZ005", "S108", "PTH123", "PTH118", "ERA001", "N806", "ARG002", "SLF001", "S311"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["core"]
omit = ["tests/*", "runtime/demo_*", "integrations/demo_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.",
    "pass",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = true
fail_under = 80
